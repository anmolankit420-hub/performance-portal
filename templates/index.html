<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Portal - Powered by ASR</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #0d0d0d; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: #141414; border-bottom: 2px solid #ff6600; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-box { background: #ff6600; color: #000; font-weight: 700; padding: 8px 14px; border-radius: 8px; font-size: 1.2rem; }
        .logo-text { font-size: 1.3rem; font-weight: 600; color: #ff6600; }
        .admin-link { color: #fff; text-decoration: none; background: #222; padding: 8px 16px; border-radius: 6px; border: 1px solid #ff6600; transition: 0.3s; }
        .admin-link:hover { background: #ff6600; color: #000; }
        .main-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
        .login-card { background: #1a1a1a; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(255,102,0,0.2); width: 100%; max-width: 450px; border: 1px solid #333; text-align: center; }
        .login-card h1 { color: #ff6600; margin-bottom: 10px; font-size: 1.8rem; }
        .login-card p { color: #aaa; margin-bottom: 30px; font-size: 0.95rem; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; color: #ddd; font-weight: 500; }
        .form-control { width: 100%; padding: 14px; background: #111; border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 1rem; outline: none; }
        .form-control:focus { border-color: #ff6600; }
        .btn-submit { width: 100%; padding: 14px; background: #ff6600; color: #000; font-weight: 700; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
        .btn-submit:hover { background: #e05b00; }
        .alert-error { background: rgba(255,0,0,0.1); border: 1px solid #ff4444; color: #ff6666; padding: 12px; border-radius: 8px; margin-bottom: 20px; }
        .alert-warning { background: rgba(255,165,0,0.1); border: 1px solid #ffaa00; color: #ffcc00; padding: 15px; border-radius: 8px; margin-bottom: 20px; line-height: 1.5; }
        footer { text-align: center; padding: 20px; background: #141414; color: #888; font-size: 0.9rem; border-top: 1px solid #222; }
        footer span { color: #ff6600; font-weight: 600; }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="logo-box">IA</div>
            <div class="logo-text">Performance Portal</div>
        </div>
        <a href="/admin_login" class="admin-link">Admin Panel</a>
    </header>
    <div class="main-container">
        <div class="login-card">
            <h1>Performance Portal</h1>
            <p>Enter your CZ ID to check real-time performance</p>
            {% if error %}<div class="alert-error">{{ error }}</div>{% endif %}
            {% if warning %}<div class="alert-warning">{{ warning }}</div>{% endif %}
            <form action="/check_performance" method="POST">
                <div class="form-group">
                    <label for="cz_id">CZ ID</label>
                    <input type="text" id="cz_id" name="cz_id" class="form-control" placeholder="Enter your CZ ID (e.g. 41368)" required autocomplete="off">
                </div>
                <button type="submit" class="btn-submit">Check My Performance</button>
            </form>
        </div>
    </div>
    <footer>
        Performance Portal &bull; Powered by <span>ASR</span>
    </footer>
</body>
</html>
