<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Agent Performance</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #1e1e1e; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; color: #ff7b00; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-size: 14px; color: #ccc; }
        input { padding: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; }
        input:focus { border-color: #ff7b00; outline: none; }
        input[readonly] { background: #1a1a1a; color: #777; cursor: not-allowed; }
        .full-width { grid-column: span 2; }
        .btn-container { margin-top: 25px; display: flex; gap: 10px; }
        button { background: #28a745; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #218838; }
        .back-btn { background: #6c757d; text-decoration: none; color: white; padding: 12px 20px; border-radius: 4px; text-align: center; display: inline-block; font-weight: bold; }
        .back-btn:hover { background: #5a6268; }
    </style>
</head>
<body>

<div class="container">
    <h2>Edit Agent: {{ agent['Names'] }} (CZ ID: {{ agent['CZ ID'] }})</h2>
    
    <form method="POST">
        <div class="form-grid">
            <!-- Hidden field for CZ ID so it securely passes on form submit -->
            <input type="hidden" name="CZ ID" value="{{ agent['CZ ID'] }}">

            {% for key, value in agent.items() %}
                {% if key != 'CZ ID' %}
                <div class="form-group">
                    <label>{{ key }}</label>
                    <input type="text" name="{{ key }}" value="{{ value }}">
                </div>
                {% endif %}
            {% endfor %}
        </div>
        
        <div class="btn-container">
            <button type="submit">Update Performance</button>
            <a href="/admin_panel" class="back-btn">Back to Admin Panel</a>
        </div>
    </form>
</div>

</body>
</html>
