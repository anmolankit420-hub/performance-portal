<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Performance Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #0d0d0d; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: #141414; border-bottom: 2px solid #ff6600; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-box { background: #ff6600; color: #000; font-weight: 700; padding: 8px 14px; border-radius: 8px; font-size: 1.2rem; }
        .logo-text { font-size: 1.3rem; font-weight: 600; color: #ff6600; }
        .back-btn { color: #fff; text-decoration: none; background: #222; padding: 8px 16px; border-radius: 6px; border: 1px solid #ff6600; }
        .back-btn:hover { background: #ff6600; color: #000; }
        .main-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
        .login-card { background: #1a1a1a; padding: 40px; border-radius: 16px; border: 1px solid #333; width: 100%; max-width: 400px; text-align: center; }
        .login-card h1 { color: #ff6600; margin-bottom: 10px; font-size: 1.6rem; }
        .login-card p { color: #aaa; margin-bottom: 25px; font-size: 0.9rem; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; color: #ddd; font-weight: 500; }
        .form-control { width: 100%; padding: 12px; background: #111; border: 1px solid #444; border-radius: 8px; color: #fff; outline: none; }
        .form-control:focus { border-color: #ff6600; }
        .btn-submit { width: 100%; padding: 12px; background: #ff6600; color: #000; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; }
        .btn-submit:hover { background: #e05b00; }
        .alert-error { background: rgba(255,0,0,0.1); border: 1px solid #ff4444; color: #ff6666; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; }
        footer { text-align: center; padding: 20px; background: #141414; color: #888; font-size: 0.9rem; border-top: 1px solid #222; }
        footer span { color: #ff6600; font-weight: 600; }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <div class="logo-box">IA</div>
            <div class="logo-text">Performance Portal</div>
        </div>
        <a href="/" class="back-btn">&larr; Home</a>
    </header>
    <div class="main-container">
        <div class="login-card">
            <h1>Admin Login</h1>
            <p>Enter password to manage portal</p>
            {% if error %}<div class="alert-error">{{ error }}</div>{% endif %}
            <form method="POST">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter admin password" required>
                </div>
                <button type="submit" class="btn-submit">Login</button>
            </form>
        </div>
    </div>
    <footer>
        Performance Portal &bull; Powered by <span>ASR</span>
    </footer>
</body>
</html>
