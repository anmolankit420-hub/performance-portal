<!-- Excel Upload Section -->
<div style="background: #222; padding: 20px; margin-bottom: 20px; border-radius: 8px; color: white;">
    <h3>Upload Master Excel Data</h3>
    <form action="/admin/upload_excel" method="POST" enctype="multipart/form-data">
        <input type="file" name="excel_file" accept=".xlsx, .xls" required style="margin-bottom: 10px; color: white;">
        <br>
        <button type="submit" style="background: #ff7b00; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer;">Upload & Replace Data</button>
    </form>
</div>

<!-- Add New Agent Section -->
<div style="background: #222; padding: 20px; margin-bottom: 20px; border-radius: 8px; color: white;">
    <h3>Add New Agent Manually</h3>
    <form action="/admin/add_agent" method="POST" style="display: flex; gap: 10px; flex-wrap: wrap;">
        <input type="text" name="cz_id" placeholder="CZ ID" required style="padding: 8px; background: #333; border: 1px solid #444; color: white; border-radius: 4px;">
        <input type="text" name="name" placeholder="Agent Name" required style="padding: 8px; background: #333; border: 1px solid #444; color: white; border-radius: 4px;">
        <input type="text" name="tl" placeholder="Team Leader (TL)" style="padding: 8px; background: #333; border: 1px solid #444; color: white; border-radius: 4px;">
        <input type="text" name="shift" placeholder="Shift" style="padding: 8px; background: #333; border: 1px solid #444; color: white; border-radius: 4px;">
        <button type="submit" style="background: #28a745; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer;">Add Agent</button>
    </form>
</div>

<!-- Agents Table -->
<table style="width: 100%; border-collapse: collapse; color: white; background: #1e1e1e;">
    <thead>
        <tr style="background: #333; text-align: left;">
            <th style="padding: 10px;">CZ ID</th>
            <th style="padding: 10px;">Name</th>
            <th style="padding: 10px;">Status</th>
            <th style="padding: 10px;">Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for agent in agents %}
        <tr style="border-bottom: 1px solid #444;">
            <td style="padding: 10px;">
                <a href="/admin/edit_agent/{{ agent['CZ ID'] }}" style="color: #ff7b00; text-decoration: none; font-weight: bold;">
                    {{ agent['CZ ID'] }}
                </a>
            </td>
            <td style="padding: 10px;">
                <a href="/admin/edit_agent/{{ agent['CZ ID'] }}" style="color: white; text-decoration: none;">
                    {{ agent['Names'] }}
                </a>
            </td>
            <td style="padding: 10px;">
                <span style="padding: 4px 8px; border-radius: 4px; background: {% if agent['Status'] == 'Active' %}green{% else %}red{% endif %};">
                    {{ agent['Status'] }}
                </span>
            </td>
            <td style="padding: 10px; display: flex; gap: 5px;">
                <!-- Toggle Active/Inactive -->
                <form action="/admin/toggle_status/{{ agent['CZ ID'] }}" method="POST">
                    <button type="submit" style="background: {% if agent['Status'] == 'Active' %}#dc3545{% else %}#28a745{% endif %}; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">
                        {% if agent['Status'] == 'Active' %}Inactivate{% else %}Activate{% endif %}
                    </button>
                </form>
                <!-- Edit Profile -->
                <a href="/admin/edit_agent/{{ agent['CZ ID'] }}" style="background: #007bff; color: white; padding: 5px 10px; border-radius: 4px; text-decoration: none; display: inline-block;">Edit</a>
                <!-- Delete Agent -->
                <form action="/admin/delete_agent/{{ agent['CZ ID'] }}" method="POST" onsubmit="return confirm('Are you sure you want to delete this agent?');">
                    <button type="submit" style="background: #6c757d; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
